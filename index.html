<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kylian fa 8 anys!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f5f5f5;font-family:'Noto Sans',sans-serif;color:#363636}
  a{color:#072b55}
  .card{width:390px;max-width:100%;margin:0 auto;background:#fff;box-sizing:border-box}
  .card img{display:block;width:100%;height:auto}
  .body{padding:32px 28px 36px;display:flex;flex-direction:column;gap:20px;text-align:center}
  .eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#072b55}
  h1{margin:0;font-family:'Poppins',sans-serif;font-size:34px;line-height:1.2;color:#072b55}
  p{margin:0;font-size:16px;line-height:1.5em;color:#505050}
  .info{display:flex;flex-direction:column;gap:12px;padding:20px;background:#f0f0f0;border-radius:10px}
  .info p{color:#363636;font-weight:600}
  .btns{display:flex;flex-direction:column;gap:12px;margin-top:4px}
  .btn{display:block;text-align:center;text-decoration:none;border-radius:5px;padding:14px 20px;font-size:16px;font-weight:600}
  .yes{background:#072b55;color:#fff}
  .no{background:#fff;color:#072b55;border:1px solid #072b55}
</style>
</head>
<body>
<div class="card">
  <img src="kylian.jpg" alt="Kylian">
  <div class="body">
    <p class="eyebrow">Estàs convidat</p>
    <h1>Kylian fa 8 anys!</h1>
    <p>Kylian fa 8 anys el dia 26, i vol celebrar-ho amb tu.</p>
    <div class="info">
      <p>Dilluns 26/10, a les 17:00</p>
      <p style="font-weight:400;color:#505050">Anem a fer una gimcana i acabem amb una pesca al parc Macaya.</p>
    </div>
    <p style="font-size:14px;color:#737373">Digueu-nos si podeu venir</p>
    <div class="btns">
      <a class="btn yes" href="https://docs.google.com/forms/d/e/1FAIpQLSctUIGZjJqVyuVdsNnEi4orndaZoRntE10_vJ2YI9ilp4gDlA/viewform?usp=publish-editor" target="_blank" rel="noopener">Hi seré</a>
      <a class="btn no" href="https://docs.google.com/forms/d/e/1FAIpQLSctUIGZjJqVyuVdsNnEi4orndaZoRntE10_vJ2YI9ilp4gDlA/viewform?usp=publish-editor" target="_blank" rel="noopener">No puc venir</a>
    </div>
  </div>
</div>
</body>
</html>
